[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "clamSearch"
authors = [
    {name = "Will Koester", email = "wikoeste@cisco.com"}
]
description = "Clam AV Sig Search Tool"
version = "0.1"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "os",
    "sys",
    "dns",
    "ipaddress",
    "re",
    "shlex",
    "socket",
    "subprocess",
    "threading",
    "time",
    "jira",
    "getpass",
    "json"
]

[project.scripts]
clam = "main:main"
